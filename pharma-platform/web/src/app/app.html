<header class="shell-header">
  <a class="brand" routerLink="/">PharmaOS</a>
  <nav aria-label="Main">
    <a routerLink="/uoms" routerLinkActive="active">Units of measure</a>
    <a routerLink="/deviations" routerLinkActive="active">Deviations</a>
  </nav>
  @if (auth.user(); as u) {
    <span class="who" title="Signed in as {{ u.login }}">{{ u.name ?? u.login }}</span>
    <button type="button" class="secondary small" (click)="auth.logout()">Sign out</button>
  }
  <span class="env" [attr.data-env]="config.environment" title="Environment">{{ config.environment }}</span>
</header>
@if (auth.user() === null) {
  <div class="banner warning signin" role="status">
    <span>You are not signed in.</span>
    <button type="button" (click)="auth.login()">Sign in</button>
  </div>
}
<main>
  <router-outlet />
</main>
