name: pharmaos-schema

on:
  pull_request:
    paths: ["pharma-platform/**", ".github/workflows/pharmaos-schema.yml"]
  push:
    branches: [main]
    paths: ["pharma-platform/**"]

jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmaos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pharmaos
    defaults:
      run:
        working-directory: pharma-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files are in sync with catalog
        run: python3 tools/schema_gen.py --check
      - name: Traceability matrix is in sync with the URS and the tests
        run: python3 tools/rtm_gen.py --check
      - name: Apply DDL
        run: for f in database/schema/0*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$f" > /dev/null; done
      - name: Data-integrity tests (OQ-DI-001..009)
        run: psql -v ON_ERROR_STOP=1 -f database/tests/integrity_tests.sql

  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      PHARMAOS_TEST_PG: Host=localhost;Username=postgres;Password=postgres
    defaults:
      run:
        working-directory: pharma-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings are errors)
        run: dotnet build PharmaOS.slnx -c Release
      - name: Unit tests
        run: dotnet test tests/PharmaOS.UnitTests -c Release --no-build
      - name: Integration tests (real PostgreSQL 16, generated schema)
        run: dotnet test tests/PharmaOS.IntegrationTests -c Release --no-build

  web:
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: "false"
    defaults:
      run:
        working-directory: pharma-platform/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pharma-platform/web/package-lock.json
      - run: npm ci
      - name: Unit and component tests (includes C#/TS rule parity on tests/rules-golden)
        run: npx ng test --watch=false
      - name: Production build (strict templates)
        run: npx ng build

  licence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pharma-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pharma-platform/web/package-lock.json
      - run: npm ci
        working-directory: pharma-platform/web
      - name: Install the CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX
      - name: Build the SBOMs and check every licence against the allow-list
        run: python3 tools/sbom_licence_check.py

  installer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    defaults:
      run:
        working-directory: pharma-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the installation wizard end to end (frontend covered by the web job)
        run: ./install.sh --non-interactive --pg-host localhost --db pharmaos_ci --skip-web
      - name: Report must exist, verify and contain no failed checks
        run: |
          r=$(ls install-reports/install-report-*.md)
          (cd install-reports && sha256sum -c "$(basename "$r").sha256")
          if grep -E '\| FAIL \|' "$r"; then echo "Report contains failed checks"; exit 1; fi
          grep -q 'SMOKE' "$r"


  e2e:
    # Real sign-in: Keycloak (development realm) → backend-for-frontend → Angular, in Chrome.
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NG_CLI_ANALYTICS: "false"
    defaults:
      run:
        working-directory: pharma-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pharma-platform/web/package-lock.json
      - name: Start Keycloak with the development realm
        run: docker compose -f deploy/keycloak/docker-compose.dev.yml up -d
      - name: Create the database with the demo organisation (installer, no frontend, no smoke check)
        run: ./install.sh --non-interactive --pg-host localhost --db pharmaos_e2e --skip-web --skip-smoke --demo-data
      - name: Backup and restore reproduces the database with demo data (schema, every row, audit trail)
        run: PGPASSWORD=postgres tools/backup_restore_test.sh pharmaos_e2e localhost 5432 postgres
      - name: Start the backend (Development settings point at the local Keycloak)
        run: |
          set -a; source pharmaos.env; set +a
          ASPNETCORE_ENVIRONMENT=Development nohup dotnet run --project src/Hosts/PharmaOS.Platform.Host \
            -c Release --urls http://localhost:5080 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Start the frontend
        working-directory: pharma-platform/web
        run: |
          npm ci
          nohup npx ng serve --port 4200 > "$RUNNER_TEMP/ng.log" 2>&1 &
      - name: Wait for Keycloak, backend and frontend
        run: |
          for url in http://localhost:8080/realms/pharmaos/.well-known/openid-configuration \
                     http://localhost:5080/health/live http://localhost:4200/; do
            for i in $(seq 1 90); do curl -fsS -o /dev/null "$url" && break; sleep 2; done
            curl -fsS -o /dev/null "$url" || { echo "not ready: $url"; exit 1; }
          done
      - name: End-to-end tests (sign-in, e-signatures, deviation and CAPA lifecycles)
        working-directory: pharma-platform/web
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run e2e
      - name: Logs
        if: failure()
        run: |
          tail -n 200 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/ng.log" || true
          docker compose -f deploy/keycloak/docker-compose.dev.yml logs --tail 200 || true
